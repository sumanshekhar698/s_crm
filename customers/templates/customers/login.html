{% extends "base.html" %}

{% block title %}Login | S-CRM{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center align-items-center py-5"
         style="min-height: 80vh;">

        <div class="col-md-6 col-lg-4">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <!-- Logo / Title -->
                    <div class="text-center mb-4">

                        <h2 class="fw-bold">
                            S-CRM
                        </h2>

                        <p class="text-muted mb-0">
                            Sign in to your account
                        </p>

                    </div>


                    <!-- Login Form -->
                    <form method="post" action="{% url 'customers_home' %}">

                        {% csrf_token %}

                        <!-- Username -->
                        <div class="mb-3">

                            <label for="username"
                                   class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                required
                                autofocus
                            >

                        </div>


                        <!-- Password -->
                        <div class="mb-3">

                            <label for="password"
                                   class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >

                        </div>


                        <!-- Remember me -->
                        <div class="form-check mb-3">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="remember"
                                name="remember"
                            >

                            <label class="form-check-label"
                                   for="remember">
                                Remember me
                            </label>

                        </div>


                        <!-- Login Button -->
                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg">
                                Login
                            </button>

                        </div>

                    </form>


                    <!-- Forgot Password -->
                    <div class="text-center mt-4">

                        <a href="#" class="text-decoration-none">
                            Forgot your password?
                        </a>

                    </div>


                    <!-- Sign up link -->
                    <div class="text-center mt-2">

                        <span class="text-muted">Don't have an account?</span>
                        <a href="{% url 'signup' %}" class="text-decoration-none">
                            Sign up
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
