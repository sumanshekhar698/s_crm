{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="row justify-content-center align-items-center py-5"
         style="min-height: 80vh;">

        <div class="col-md-6 col-lg-4">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <div class="text-center mb-4">
                        <i class="bi {% block icon %}bi-key-fill{% endblock %} display-6 text-primary"></i>
                        <h2 class="fw-bold mt-2">{% block heading %}{% endblock %}</h2>
                        <p class="text-muted mb-0">{% block subheading %}{% endblock %}</p>
                    </div>

                    {% block card_body %}{% endblock %}

                    <div class="text-center mt-4">
                        <a href="{% url 'login' %}" class="text-decoration-none small">
                            <i class="bi bi-arrow-left me-1"></i>Back to login
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
