{% if form.non_field_errors %}
<div class="alert alert-danger small">
    {% for error in form.non_field_errors %}
        <div>{{ error }}</div>
    {% endfor %}
</div>
{% endif %}

<form method="post" novalidate>

    {% csrf_token %}

    <div class="row g-3">
        {% for field in form %}
        <div class="{% if field.name == 'address' %}col-12{% elif field.name == 'city' %}col-sm-5{% elif field.name == 'state' %}col-sm-4{% elif field.name == 'zipcode' %}col-sm-3{% elif field.name == 'status' %}col-sm-5{% else %}col-sm-6{% endif %}">
            <label for="{{ field.id_for_label }}" class="form-label">
                {{ field.label }}
            </label>
            {{ field }}
            {% for error in field.errors %}
                <div class="invalid-feedback">{{ error }}</div>
            {% endfor %}
        </div>
        {% endfor %}
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
        <a href="{{ cancel_url }}" class="btn btn-outline-secondary">
            Cancel
        </a>
        <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check-lg me-1"></i>{{ submit_label }}
        </button>
    </div>

</form>
