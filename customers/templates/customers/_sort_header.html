{% with descending="-"|add:key %}
<th scope="col">
    <a href="{% if sort == key %}{% querystring sort=descending page=None %}{% else %}{% querystring sort=key page=None %}{% endif %}"
       class="text-reset text-decoration-none d-inline-flex align-items-center gap-1">
        {{ label }}
        {% if sort == key %}
            <i class="bi bi-caret-up-fill"></i>
        {% elif sort == descending %}
            <i class="bi bi-caret-down-fill"></i>
        {% else %}
            <i class="bi bi-chevron-expand opacity-50"></i>
        {% endif %}
    </a>
</th>
{% endwith %}
